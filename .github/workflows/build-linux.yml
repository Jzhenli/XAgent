name: Build Linux App (manylinux)

on:
  push:
    tags:
      - '*-linux/v*'
      - '*-all/v*'
  workflow_dispatch:
    inputs:
      archs:
        description: 'Target architectures (comma-separated)'
        required: false
        type: choice
        options: [armv7l, aarch64, 'armv7l,aarch64']
        default: 'armv7l'
      enable_nuitka:
        description: 'Enable Nuitka compilation'
        required: false
        type: boolean
        default: true
      version:
        description: 'Version override (leave empty to use pyproject.toml)'
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      app_name: ${{ steps.vars.outputs.app_name }}
      version: ${{ steps.vars.outputs.version }}
      python_version: ${{ steps.vars.outputs.python_version }}
      build_matrix: ${{ steps.matrix.outputs.build_matrix }}
    steps:
      - uses: actions/checkout@v5
      - name: Read project config
        id: vars
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          # 仅读取版本（build job 在独立 runner 注入）
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/*/v}"
          elif [[ -n "$VERSION_INPUT" ]]; then
            VERSION="$VERSION_INPUT"
          else
            VERSION=$(grep '^version = ' pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          fi
          echo "app_name=$(grep '^name = ' pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "python_version=$(grep 'python_version' pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')" >> $GITHUB_OUTPUT
      - name: Generate matrix
        id: matrix
        run: |
          ARCHS="${{ inputs.archs || 'armv7l' }}"
          MATRIX=""
          # armv7l→manylinux_2_31 (glibc 2.31)；aarch64→manylinux_2_28 (glibc 2.28)
          [[ "$ARCHS" == *"armv7l"* ]] && MATRIX+='{"arch":"armv7l","qemu_arch":"armv7","image":"quay.io/pypa/manylinux_2_31_armv7l"},'
          [[ "$ARCHS" == *"aarch64"* ]] && MATRIX+='{"arch":"aarch64","qemu_arch":"aarch64","image":"quay.io/pypa/manylinux_2_28_aarch64"},'
          echo "build_matrix=[${MATRIX%,}]" >> $GITHUB_OUTPUT

  build:
    needs: config
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.config.outputs.build_matrix) }}

    steps:
      - uses: actions/checkout@v5
      - name: Inject version into pyproject.toml
        run: |
          sed -i "s/^version = \".*\"/version = \"${{ needs.config.outputs.version }}\"/" pyproject.toml
          echo "Updated pyproject.toml version to ${{ needs.config.outputs.version }}"
          grep '^version = ' pyproject.toml

      - name: Resolve PBS metadata
        id: pbs
        run: |
          PY_VER="${{ needs.config.outputs.python_version }}"
          PY_MINOR=$(echo "$PY_VER" | cut -d. -f1,2)

          case "$PY_MINOR" in
            3.10) FULL_PY_VER="3.10.20" ;;
            3.11) FULL_PY_VER="3.11.15" ;;
            3.12) FULL_PY_VER="3.12.13" ;;
            *) echo "::error::Unsupported Python: $PY_VER" && exit 1 ;;
          esac

          case "${{ matrix.arch }}" in
            armv7l)  TRIPLE="armv7-unknown-linux-gnueabihf" ;;
            aarch64) TRIPLE="aarch64-unknown-linux-gnu" ;;
          esac

          PBS_TAG="20260610"
          FILENAME="cpython-${FULL_PY_VER}+${PBS_TAG}-${TRIPLE}-install_only_stripped.tar.gz"
          echo "url=https://github.com/astral-sh/python-build-standalone/releases/download/${PBS_TAG}/${FILENAME}" >> $GITHUB_OUTPUT
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT

      - name: Download PBS runtime (host)
        run: |
          F="${{ steps.pbs.outputs.filename }}"
          echo "Downloading ${{ steps.pbs.outputs.url }} -> $F"
          curl -fsSL --retry 3 --retry-connrefused --retry-delay 5 "${{ steps.pbs.outputs.url }}" -o "$F"
          [[ -s "$F" ]] || { echo "::error::PBS download failed"; exit 1; }
          ls -lh "$F"

      - name: Fetch pyapp source (host)
        run: |
          rm -rf pyapp_src
          git clone --depth 1 https://github.com/Jzhenli/pyapp.git pyapp_src

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Build frontend
        run: |
          cd frontend
          [[ -f package-lock.json ]] && npm ci || npm install
          npm run build

      - name: Build on ${{ matrix.arch }} (${{ matrix.image }})
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: ${{ matrix.qemu_arch }}
          image: ${{ matrix.image }}
          githubToken: ${{ github.token }}
          run: |
            set -e
            
            # PBS 已下载到工作区，直接解压安装
            PBS_FILENAME="${{ steps.pbs.outputs.filename }}"
            [[ -s "$PBS_FILENAME" ]] || { echo "::error::PBS runtime $PBS_FILENAME not found in workspace (host download step may have failed)"; exit 1; }

            mkdir -p /opt/python
            tar -xzf "$PBS_FILENAME" -C /opt/python --strip-components=1
            ln -sf /opt/python/bin/python3 /usr/bin/python3
            export PATH="/opt/python/bin:$PATH"
            command -v python3 >/dev/null 2>&1 || { echo "::error::python3 unavailable after PBS install"; exit 1; }
            python3 --version

            # armv7l: piwheels 提速，但 cffi 须走 sdist（避免 bookworm wheel 链接 glibc 2.36/libffi.so.8 板端加载不了）
            if [ "${{ matrix.arch }}" = "armv7l" ]; then
              export PIP_EXTRA_INDEX_URL="https://www.piwheels.org/simple"
              export PIP_NO_BINARY=cffi
            fi

            # 预填充 pyapp 运行时缓存，避免重复下载
            CACHE_DIR="/root/.pyapp/cache/runtimes"
            mkdir -p "$CACHE_DIR"
            cp "$PBS_FILENAME" "$CACHE_DIR/$PBS_FILENAME"

            # 安装 pyapp（运行于 PBS CPython），bundle 运行时取自同一 PBS 缓存；源码已在宿主机克隆，容器内从本地路径安装
            python3 -m pip install --upgrade pip
            python3 -m pip install "./pyapp_src[compile]"

            pyapp build linux --arch ${{ matrix.arch }}

            # 断言 cffi 未链接高于板端支持的 glibc / libffi
            PKG_DIR="$(find bundles/linux -maxdepth 4 -type d -name app_packages | head -1)"
            CFFI_SO="$(find "$PKG_DIR" -maxdepth 1 -name '_cffi_backend'*.so | head -1)"
            if [ -z "$CFFI_SO" ]; then
              # cffi 缺位（间接依赖被裁剪）时跳过，不阻断构建
              echo "::warning::cffi not present in bundle (pkg_dir=$PKG_DIR), skip glibc/libffi assert"
            elif grep -aqE 'GLIBC_2\.34|libffi\.so\.8' "$CFFI_SO"; then
              echo "::error::cffi links newer glibc/libffi than target board supports: $CFFI_SO"
              exit 1
            else
              echo "cffi glibc/libffi assert passed: $CFFI_SO"
            fi

            [[ "${{ inputs.enable_nuitka }}" != "false" ]] && pyapp compile linux

            pyapp package linux

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ${{ needs.config.outputs.app_name }}-${{ needs.config.outputs.version }}-linux-${{ matrix.arch }}
          path: dist/*.tar.gz

      - name: Summary
        if: always()
        run: |
          echo "### Linux Build (${{ matrix.arch }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ needs.config.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Arch**: ${{ matrix.arch }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: ${{ matrix.image }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Nuitka**: ${{ inputs.enable_nuitka != false }}" >> $GITHUB_STEP_SUMMARY
