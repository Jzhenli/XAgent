name: Build Linux App (manylinux)

on:
  push:
    tags:
      - '*-linux/v*'
      - '*-all/v*'
  workflow_dispatch:
    inputs:
      archs:
        description: 'Target architectures (comma-separated)'
        required: false
        type: choice
        options: [armv7l, aarch64, 'armv7l,aarch64']
        default: 'armv7l'
      enable_nuitka:
        description: 'Enable Nuitka compilation'
        required: false
        type: boolean
        default: true
      version:
        description: 'Version override (leave empty to use pyproject.toml)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config:
    runs-on: ubuntu-24.04
    outputs:
      app_name: ${{ steps.vars.outputs.app_name }}
      version: ${{ steps.vars.outputs.version }}
      python_version: ${{ steps.vars.outputs.python_version }}
      build_matrix: ${{ steps.matrix.outputs.build_matrix }}
    steps:
      - uses: actions/checkout@v5
      - name: Read project config
        id: vars
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/*/v}"
          elif [[ -n "$VERSION_INPUT" ]]; then
            VERSION="$VERSION_INPUT"
          else
            VERSION=$(grep '^version = ' pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          fi
          # 各 job 独立 runner，版本由 build job 注入，此处不回写
          echo "app_name=$(grep '^name = ' pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "python_version=$(grep 'python_version' pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')" >> $GITHUB_OUTPUT
      - name: Generate matrix
        id: matrix
        run: |
          # 官方 manylinux 镜像（https://github.com/pypa/manylinux），glibc 封顶由容器工具链决定：
          #   armv7l  -> manylinux_2_31（唯一支持 armv7l 的策略），QEMU 模拟
          #   aarch64 -> manylinux_2_28，原生 arm64 runner
          ARCHS="${{ inputs.archs || 'armv7l' }}"
          # *-all/v* tag 构建全部架构
          [[ "$GITHUB_REF" == refs/tags/*-all/* ]] && ARCHS="armv7l,aarch64"
          MATRIX=""
          [[ "$ARCHS" == *"armv7l"* ]] && MATRIX+='{"arch":"armv7l","platform":"linux/arm/v7","image":"quay.io/pypa/manylinux_2_31_armv7l","runner":"ubuntu-24.04"},'
          [[ "$ARCHS" == *"aarch64"* ]] && MATRIX+='{"arch":"aarch64","platform":"linux/arm64","image":"quay.io/pypa/manylinux_2_28_aarch64","runner":"ubuntu-24.04-arm"},'
          echo "build_matrix=[${MATRIX%,}]" >> $GITHUB_OUTPUT

  build:
    needs: config
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.config.outputs.build_matrix) }}

    steps:
      - uses: actions/checkout@v5
      - name: Inject version into pyproject.toml
        run: |
          sed -i "s/^version = \".*\"/version = \"${{ needs.config.outputs.version }}\"/" pyproject.toml
          grep '^version = ' pyproject.toml

      - name: Fetch pyapp source (host)
        run: |
          rm -rf pyapp_src
          git clone --quiet https://github.com/Jzhenli/pyapp.git pyapp_src
          git -C pyapp_src describe --tags

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Build frontend
        run: |
          cd frontend
          if [[ -f package-lock.json ]]; then npm ci; else npm install; fi
          npm run build

      - name: Set up QEMU
        if: matrix.arch == 'armv7l'
        uses: docker/setup-qemu-action@v4

      - name: Build in ${{ matrix.image }}
        run: |
          docker run --rm -i \
            --platform ${{ matrix.platform }} \
            -v "$GITHUB_WORKSPACE":/work -w /work \
            ${{ matrix.image }} \
            bash -s <<'SCRIPT'
            set -euo pipefail

            # 0. 确认在官方 manylinux 镜像内（AUDITWHEEL_* 为官方内建标识）
            echo "AUDITWHEEL_PLAT=${AUDITWHEEL_PLAT:-<unset>}"
            [[ -n "${AUDITWHEEL_PLAT:-}" ]] || {
              echo "::error::AUDITWHEEL_PLAT is unset - this is NOT a manylinux image"; exit 1;
            }
            command -v manylinux-interpreters >/dev/null 2>&1 && manylinux-interpreters list || true

            # 1. 构建解释器：镜像自带 cp311
            PY=/opt/python/cp311-cp311/bin/python3
            [[ -x "$PY" ]] || {
              echo "::error::$PY not found in image ${AUDITWHEEL_PLAT}"; exit 1;
            }
            "$PY" --version
            export PATH="/opt/python/cp311-cp311/bin:$PATH"

            # 2. armv7l: piwheels 提速；cffi 强制 sdist（其预编译 wheel 为 bookworm 构建，板端加载不了）
            if [[ "${{ matrix.arch }}" == "armv7l" ]]; then
              export PIP_EXTRA_INDEX_URL="https://www.piwheels.org/simple"
              export PIP_NO_BINARY=cffi
            fi

            # 3. 安装 pyapp-cli（--no-build-isolation + setuptools-scm<9，规避版本冲突）
            "$PY" -m pip install --upgrade pip setuptools wheel "setuptools-scm<9"
            "$PY" -m pip install --no-build-isolation "./pyapp_src[compile]"
            pyapp --version

            # 4. 构建 bundle（运行时由 pyapp 按 pyproject 的 python_version 下载）
            pyapp build linux --arch ${{ matrix.arch }}

            # 5. armv7l: 断言 cffi 非预编译 wheel（防 bookworm 产物混入）
            if [[ "${{ matrix.arch }}" == "armv7l" ]]; then
              PKG_DIR="$(find bundles/linux -maxdepth 4 -type d -name app_packages 2>/dev/null | head -1)"
              CFFI_SO="$(find "$PKG_DIR" -maxdepth 1 -name '_cffi_backend'*.so 2>/dev/null | head -1)"
              if [[ -z "$CFFI_SO" ]]; then
                echo "::warning::cffi not present in bundle (pkg_dir=$PKG_DIR), skip glibc/libffi assert"
              elif grep -aqE 'GLIBC_2\.34|libffi\.so\.8' "$CFFI_SO"; then
                echo "::error::cffi links newer glibc/libffi than target board supports: $CFFI_SO"
                exit 1
              else
                echo "cffi glibc/libffi assert passed: $CFFI_SO"
              fi
            fi

            # 6. Nuitka 编译 + 打包
            if [[ "${{ inputs.enable_nuitka }}" != "false" ]]; then
              pyapp compile linux
            fi

            pyapp package linux
          SCRIPT

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ${{ needs.config.outputs.app_name }}-${{ needs.config.outputs.version }}-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          echo "### Linux Build (${{ matrix.arch }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ needs.config.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Arch**: ${{ matrix.arch }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: ${{ matrix.image }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Runner**: ${{ matrix.runner }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Nuitka**: ${{ inputs.enable_nuitka != 'false' }}" >> $GITHUB_STEP_SUMMARY
