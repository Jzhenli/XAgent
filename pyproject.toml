[project]
name = "XPlay"
version = "3.0.1"
description = "A cross-platform application built with PyApp"
authors = [{name = "Developer", email = "dev@example.com"}]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn>=0.30.0",
    "platformdirs>=4.0.0",
    "pyapp-runtime>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pyapp]
python_version = "3.10"
app_module = "XAgent"
port = 18080
pip_index_url = "https://jzhenli.github.io/my-pypi/"
pip_extra_index_urls = ["https://pypi.org/simple"]

[tool.pyapp.android]
package_name = "com.example.xagent"
min_sdk = 24
target_sdk = 34
permissions = [
    "INTERNET",
    "ACCESS_NETWORK_STATE",
]
dependencies = [
    "pydantic_core==2.46.3",
    "pydantic==2.13.3",
    "fastapi==0.136.1",
    "uvicorn>=0.27.0",
    "aiosqlite>=0.19.0",
    "pyyaml>=6.0.1",
    "prometheus-client>=0.19.0",
    "python-multipart>=0.0.6",
    "pymodbus>=3.5.0",
    "pyserial>=3.5",
    "aiomqtt>=0.1.0",
    "xknx==3.20.0",
    "bacpypes3==0.0.106",
    "protobuf>=4.25.0",
    "platformdirs>=3.0.0",
    "psutil",
    "pyapp-runtime>=0.1.0",
]
icon = "icons/android/xplay"

[tool.pyapp.windows]
deployment = "standalone"
create_service = true
service_name = "Xagent"
dependencies = [
    "pydantic_core==2.46.3",
    "pydantic==2.13.3",
    "fastapi==0.136.1",
    "uvicorn>=0.27.0",
    "aiosqlite>=0.19.0",
    "pyyaml>=6.0.1",
    "prometheus-client>=0.19.0",
    "python-multipart>=0.0.6",
    "pymodbus>=3.5.0",
    "pyserial>=3.5",
    "aiomqtt>=0.1.0",
    "xknx==3.20.0",
    "bacpypes3==0.0.106",
    "protobuf>=4.25.0",
    "platformdirs>=3.0.0",
    "psutil",
    "pyapp-runtime>=0.1.0",
]
icon = "icons/windows/xplay"

[tool.pyapp.linux]
deployment = "shared"
install_systemd = true
service_name = "XAgent"
dependencies = [
    "pydantic_core==2.46.3",
    "pydantic==2.13.3",
    "fastapi==0.136.1",
    "uvicorn>=0.27.0",
    "aiosqlite>=0.19.0",
    "pyyaml>=6.0.1",
    "prometheus-client>=0.19.0",
    "python-multipart>=0.0.6",
    "pymodbus>=3.5.0",
    "pyserial>=3.5",
    "aiomqtt>=0.1.0",
    "xknx==3.20.0",
    "bacpypes3==0.0.106",
    "protobuf>=4.25.0",
    "platformdirs>=3.0.0",
    "psutil",
    "pyapp-runtime>=0.1.0",
]